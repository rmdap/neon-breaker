<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BREAKER — smash every brick</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #04061a;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace, system-ui, sans-serif;
  }
  #wrap {
    width: min(1280px, 100vw);
    aspect-ratio: 1280 / 720;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    background: #070a1a;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
